<html lang="en">
<head>

    <meta name="theme-color" content="#000000">

    <title>ATLAS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        html,

        body {

            background-image: url("./atlas-hud.png");

        }

    <div id="atlas-screen"></div>
